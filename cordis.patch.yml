# dsh-imap bundle 补丁：把插件行插入 host 组合
- insert:
    - id: webgis
      name: dsh-imap
      config:
        # 默认底图（Carto light tiles；Carto 需带账号 key 去「API key required」水印）。
        # ⚠️ 该 key 是部署账号私有——发布公共 npm 前请移出（换 OSM / 自建 / 环境注入），勿随包分发。
        baseTileUrl: https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2ynp_1_f4210333ac56345b838752b4
        # 天地图密钥（tk）：也可在设置 → 插件 → IMap → 天地图 中选择影像/矢量服务并填写密钥。
        # GUI 配置的密钥存 DSH 凭据存储，设置页只回显前 4 位与后 4 位；此处的 tiandituKey 仅作兜底。
        # 申请：https://console.tianditu.gov.cn （创建「浏览器端」应用类型）。留空则天地图条目置灰。
        # tiandituKey: <你的天地图密钥>
        # （不再默认加载示例数据集 assets/sample.geojson；需要的话可取消注释下一行）
        # defaultDataset: assets/sample.geojson
        # 视觉模型（看图委托）：主模型为文本模型时，webgis_get_pick 会委托此模型分析地图截图
        # 并返回文字分析。需先在 DSH 里配置好对应 provider 的 adapter 与 API key。
        # 留空 / 不写则纯文本模型只拿到坐标+要素+截图范围（不看图）。
        # vision:
        #   provider: <如 qwen-vl / glm / openai 等已配置的 provider 路由>
        #   model: <视觉模型 id，如 qwen-vl-max>
